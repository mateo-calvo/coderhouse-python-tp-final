{% extends 'base.html' %}

{% block title %}Eliminar Publicación - CoderBlog{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card shadow-sm border-0 border-top border-danger border-4">
      <div class="card-body p-4 text-center">
        <div class="text-danger mb-3">
          <i class="bi bi-exclamation-triangle-fill display-3"></i>
        </div>
        <h3 class="fw-bold text-dark">¿Eliminar publicación?</h3>
        <p class="text-muted mb-4">
          Esta acción no se puede deshacer. Se eliminará permanentemente el artículo:
          <br>
          <strong class="text-dark">"{{ object.titulo }}"</strong>
        </p>

        <form method="POST">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'post_detail' object.pk %}" class="btn btn-outline-secondary px-4">
              Cancelar
            </a>
            <button type="submit" class="btn btn-danger px-4 fw-semibold">
              <i class="bi bi-trash me-1"></i> Sí, eliminar definitivamente
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
